name: Update contribution data

# Fetch GitHub's official contributions endpoint on a schedule and commit a
# same-origin JSON file. The official endpoint has no CORS, so the static page
# cannot call it directly; this Action bridges that gap with zero third parties.
on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:        # allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch official contributions
        run: python3 fetch_contributions.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contributions.json
          if git diff --cached --quiet; then
            echo "No changes to contribution data"
          else
            git commit -m "chore: refresh official contribution data [skip ci]"
            git push
          fi
