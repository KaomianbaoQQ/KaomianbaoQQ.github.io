<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KaomianbaoQQ · GitHub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:#58a6ff;text-decoration:none}
a:hover{text-decoration:underline}
.lang-switch{position:fixed;top:16px;right:16px;z-index:10;display:flex;background:#161b22;border:1px solid #30363d;border-radius:6px;overflow:hidden}
.lang-switch button{background:transparent;border:0;color:#8b949e;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;line-height:1.2}
.lang-switch button:hover{color:#c9d1d9}
.lang-switch button.active{background:#21262d;color:#f0f6fc}
.page{max-width:1180px;margin:0 auto;padding:24px 32px 80px}
.profile-head{display:flex;gap:16px;align-items:center;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid #21262d}
.avatar{width:88px;height:88px;border-radius:50%;border:1px solid #30363d;object-fit:cover;display:block;background:#161b22;flex:none}
.profile-meta{min-width:0}
.name{font-size:22px;font-weight:600;color:#f0f6fc;margin:0;line-height:1.25}
.login{font-size:15px;color:#8b949e;margin:2px 0 10px}
.follow-btn{display:inline-block;background:#21262d;border:1px solid #30363d;border-radius:6px;padding:5px 14px;color:#c9d1d9;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none}
.follow-btn:hover{background:#30363d;text-decoration:none}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr) 70px;gap:24px;align-items:start}
.sidebar{min-width:0}
.card-title{font-size:14px;font-weight:600;color:#f0f6fc;margin:0 0 12px}
.badges img{width:220px;max-width:100%;height:auto;display:block}
.side-sep{border:0;border-top:1px solid #21262d;margin:20px 0}
.block-link{color:#8b949e;font-size:13px;cursor:pointer}
.block-link:hover{color:#58a6ff}
.main{min-width:0}
.contrib-title{font-size:16px;margin:0 0 12px;font-weight:400}
.contrib-card{border:1px solid #30363d;border-radius:6px;padding:16px;background:#0d1117;overflow:hidden}
.contrib-card svg{display:block;max-width:100%;height:auto}
.contrib-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#8b949e;gap:16px}
.legend{display:flex;align-items:center;gap:4px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.section-h{font-size:16px;font-weight:400;margin:28px 0 12px;color:#c9d1d9}
.overview-box{border:1px solid #30363d;border-radius:6px;padding:20px}
.overview-inner{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);gap:24px}
.v-divider{background:#21262d}
.overview-label{color:#8b949e;font-size:13px;margin:0 0 10px}
.contrib-repos{margin:0;font-size:14px;line-height:1.7}
.contrib-repos a{font-weight:500}
.quad-wrap{display:flex;align-items:center;justify-content:center;min-height:170px}
.quad-svg{max-width:100%;height:auto}
.quad-label{fill:#8b949e;font-size:11px;font-family:inherit}
.axis{stroke:#3fb950;stroke-width:2;stroke-linecap:round}
.dot{fill:#fff;stroke:#3fb950;stroke-width:2}
.activity-box{margin-top:8px}
.month-line{display:flex;gap:14px;border-top:1px solid #21262d;padding:16px 0}
.month-label{color:#c9d1d9;font-weight:600;font-size:14px;min-width:92px;white-space:nowrap}
.month-content{flex:1;min-width:0}
.activity-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.activity-text{color:#c9d1d9}
.repo-tag{display:inline-block;background:#21262d;border:1px solid #30363d;border-radius:20px;padding:1px 9px;font-size:12px;margin:6px 0 0 26px;color:#c9d1d9}
.show-more{width:100%;background:#21262d;border:1px solid #30363d;border-radius:6px;padding:10px;color:#58a6ff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
.show-more:hover{background:#30363d}
.year-nav{position:sticky;top:20px;display:flex;flex-direction:column;gap:2px}
.year-nav a{color:#8b949e;font-size:13px;padding:7px 12px;border-radius:6px;text-align:center;cursor:pointer}
.year-nav a:hover{background:#21262d;text-decoration:none;color:#c9d1d9}
.year-nav a.active{background:#1f6feb;color:#fff;font-weight:600}
.src-note{margin-top:28px;font-size:12px;color:#6e7681;border-top:1px solid #21262d;padding-top:12px}
.src-note .live{color:#3fb950}
.src-note .err{color:#f85149}
.skeleton{color:#6e7681;font-size:13px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.year-nav{flex-direction:row;flex-wrap:wrap;position:static}.profile-head{flex-wrap:wrap}.page{padding:16px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
<symbol id="i-commit" viewBox="0 0 16 16"><path d="M11.93 8.5a4.002 4.002 0 0 1-7.86 0H.75a.75.75 0 0 1 0-1.5h3.32a4.002 4.002 0 0 1 7.86 0h3.32a.75.75 0 0 1 0 1.5zm-1.43-.75a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0z"/></symbol>
</svg>

<div class="lang-switch" role="group" aria-label="Language / 语言">
<button type="button" data-lang="en" class="active">EN</button>
<button type="button" data-lang="zh">中文</button>
</div>

<div class="page">

<div class="profile-head">
<img class="avatar" id="avatar" src="https://avatars.githubusercontent.com/u/275017180?v=4" alt="avatar" />
<div class="profile-meta">
<h1 class="name" id="name">KaomianbaoQQ</h1>
<p class="login" id="login">KaomianbaoQQ</p>
<a class="follow-btn" href="https://github.com/KaomianbaoQQ" target="_blank" rel="noopener" data-i18n="follow">Follow</a>
</div>
</div>

<div class="layout">

<aside class="sidebar">
<h2 class="card-title" data-i18n="achievements">Achievements</h2>
<div class="badges"><img id="trophy" src="achievements-v2.svg" alt="GitHub achievements" /></div>
<hr class="side-sep" />
<div class="block-link" data-i18n="blockUser">Block or report user</div>
</aside>

<main class="main">

<p class="contrib-title" id="contrib-title" data-i18n="loadingContrib">Loading contributions from GitHub…</p>
<div class="contrib-card">
<div id="contrib-graph"><span class="skeleton" data-i18n="loadingCalendar">Loading contribution calendar…</span></div>
<div class="contrib-foot">
<span data-i18n="learnCount">Learn how we count contributions</span>
<span class="legend"><span data-i18n="less">Less</span>
<i style="background:#161b22;border:1px solid #30363d"></i>
<i style="background:#0e4429"></i><i style="background:#006d32"></i><i style="background:#26a641"></i><i style="background:#39d353"></i>
<span data-i18n="more">More</span></span>
</div>
</div>

<h2 class="section-h" data-i18n="activityOverview">Activity overview</h2>
<div class="overview-box">
<div class="overview-inner">
<div>
<p class="overview-label" data-i18n="contributedTo">Contributed to</p>
<p class="contrib-repos" id="contrib-repos"><span class="skeleton" data-i18n="loading">Loading…</span></p>
</div>
<div class="v-divider"></div>
<div class="quad-wrap" id="quad-wrap"></div>
</div>
</div>

<h2 class="section-h" data-i18n="contributionActivity">Contribution activity</h2>
<div class="activity-box" id="activity-box"><span class="skeleton" data-i18n="loading">Loading…</span></div>
<button class="show-more" type="button" data-i18n="showMore">Show more activity</button>

<p class="src-note" id="src-note" data-i18n="loadingNote">Loading data from GitHub…</p>
</main>

<aside class="year-nav" id="year-nav"></aside>

</div>
</div>

<script>
const USERNAME='KaomianbaoQQ';
const API_USER=`https://api.github.com/users/${USERNAME}`;
const API_REPOS=`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`;
const API_CONTRIB=`https://github-contributions-api.jogruber.de/v4/${USERNAME}?y=last`;
const LEVEL_COLORS=['#161b22','#0e4429','#006d32','#26a641','#39d353'];

const I18N={
 en:{
  follow:'Follow', achievements:'Achievements', blockUser:'Block or report user',
  loadingContrib:'Loading contributions from GitHub…', loadingCalendar:'Loading contribution calendar…',
  learnCount:'Learn how we count contributions', less:'Less', more:'More', loading:'Loading…',
  activityOverview:'Activity overview', contributedTo:'Contributed to',
  contributionActivity:'Contribution activity', showMore:'Show more activity',
  loadingNote:'Loading data from GitHub…',
  contribTitle:n=>`${n} contributions in the last year`,
  noContrib:'No contribution data',
  contribOn:(n,d)=>`${n} contribution${n>1?'s':''} on ${d}`,
  noContribOn:d=>`No contributions on ${d}`,
  months:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  monthFull:['January','February','March','April','May','June','July','August','September','October','November','December'],
  weekdays:['Mon','Wed','Fri'],
  gridAria:'Contribution activity grid',
  createdCommits:(n,r)=>`Created ${n} commit${n>1?'s':''} in ${r} repositor${r>1?'ies':'y'}`,
  noActivity:'No public activity in this period',
  quadAria:(p)=>`Contribution types: ${p}% commits`,
  quadLabels:{top:'Code review',right:'Issues',bottom:'Pull requests',left:'Commits'},
  noteLiveTag:'● Live data',
  noteLive:' Contribution heatmap and activity list are fetched from GitHub on every visit and change with account activity',
  noteOfflineTag:'● Offline snapshot',
  noteOffline:' GitHub API is temporarily unavailable; showing the most recent real data snapshot',
  notePartialTag:'● Partially live',
  notePartial:' Some data comes from the last real snapshot (automatic fallback when GitHub API is rate-limited)'
 },
 zh:{
  follow:'关注', achievements:'成就', blockUser:'屏蔽或举报用户',
  loadingContrib:'正在从 GitHub 加载贡献记录…', loadingCalendar:'正在加载贡献日历…',
  learnCount:'了解贡献如何统计', less:'少', more:'多', loading:'加载中…',
  activityOverview:'活动概览', contributedTo:'贡献给',
  contributionActivity:'贡献活动', showMore:'显示更多活动',
  loadingNote:'正在从 GitHub 获取数据…',
  contribTitle:n=>`过去一年 ${n} 次贡献`,
  noContrib:'暂无贡献数据',
  contribOn:(n,d)=>`${d} 有 ${n} 次贡献`,
  noContribOn:d=>`${d} 无贡献`,
  months:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
  monthFull:['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'],
  weekdays:['周一','周三','周五'],
  gridAria:'贡献活动日历',
  createdCommits:(n,r)=>`在 ${r} 个仓库创建了 ${n} 次提交`,
  noActivity:'该时间段暂无公开活动',
  quadAria:(p)=>`贡献类型：${p}% 为提交`,
  quadLabels:{top:'代码审查',right:'议题',bottom:'拉取请求',left:'提交'},
  noteLiveTag:'● 实时数据',
  noteLive:' 贡献热力图与活动列表每次打开都从 GitHub 拉取，数据会随账号活动变化',
  noteOfflineTag:'● 离线快照',
  noteOffline:' GitHub API 暂时不可用，正展示最近一次的真实数据快照',
  notePartialTag:'● 部分实时',
  notePartial:' 部分数据来自最近一次真实快照（GitHub API 限流时自动回退，避免空白）'
 }
};

let LANG=(localStorage.getItem('gh_profile_lang')==='zh')?'zh':'en';
const STATE={user:null, repos:[], contrib:null, liveCount:0, fallbackCount:0};
function t(k,...a){const v=I18N[LANG][k];return typeof v==='function'?v(...a):v;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}

function renderProfile(u){
  document.getElementById('avatar').src=u.avatar_url||FALLBACK.avatar_url;
  document.getElementById('name').textContent=u.name||u.login;
  document.getElementById('login').textContent=u.login;
  document.title=u.login+' · GitHub';
}

function renderHeatmap(c){
  document.getElementById('contrib-title').textContent=t('contribTitle',c.total);
  const days=c.days||[];
  if(!days.length){document.getElementById('contrib-graph').textContent=t('noContrib');return;}
  const cell=11,pitch=14,ox=40,oy=26;
  const weeks=[];let cur=[];
  days.forEach(d=>{const dow=new Date(d.date+'T00:00:00Z').getUTCDay();if(dow===0&&cur.length){weeks.push(cur);cur=[];}cur.push(d);});
  if(cur.length)weeks.push(cur);
  const W=ox+weeks.length*pitch+10,H=oy+7*pitch+10;
  const months=t('months'),weekdays=t('weekdays');
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img" aria-label="${esc(t('gridAria'))}">`;
  let lastMonth=-1;
  weeks.forEach((week,i)=>{const d=new Date(week[0].date+'T00:00:00Z');const mo=d.getUTCMonth();if(mo!==lastMonth){lastMonth=mo;svg+=`<text x="${ox+i*pitch}" y="18" fill="#8b949e" font-size="10" font-family="Arial,sans-serif">${esc(months[mo])}</text>`;}});
  [[weekdays[0],1],[weekdays[1],3],[weekdays[2],5]].forEach(([lab,row])=>{svg+=`<text x="0" y="${oy+row*pitch+9}" fill="#8b949e" font-size="10" font-family="Arial,sans-serif">${esc(lab)}</text>`;});
  weeks.forEach((week,i)=>week.forEach((d,r)=>{const label=d.count?esc(t('contribOn',d.count,d.date)):esc(t('noContribOn',d.date));svg+=`<rect x="${ox+i*pitch}" y="${oy+r*pitch}" width="${cell}" height="${cell}" rx="2" fill="${LEVEL_COLORS[d.level]}"><title>${label}</title></rect>`;}));
  svg+='</svg>';
  document.getElementById('contrib-graph').innerHTML=svg;
}

function monthGroups(c){
  const map={};
  (c.days||[]).forEach(d=>{
    if(!d.count)return;
    const key=d.date.slice(0,7);
    if(!map[key])map[key]={commits:0,days:0};
    map[key].commits+=d.count;map[key].days++;
  });
  return Object.keys(map).sort().reverse().map(k=>({month:k,...map[k]}));
}

function renderActivity(c,repos){
  const box=document.getElementById('activity-box');
  const groups=monthGroups(c);
  if(!groups.length){box.innerHTML=`<span class="skeleton">${esc(t('noActivity'))}</span>`;return;}
  const repoNames=(repos||[]).slice(0,2).map(r=>r.name);
  box.innerHTML=groups.map(g=>{
    const [y,m]=g.month.split('-');
    const mi=parseInt(m,10)-1;
    const monthLabel=t('monthFull')[mi]+' '+y;
    let repoLine='';
    if(repoNames.length){
      repoLine=repoNames.map(n=>`<a href="${esc('https://github.com/'+USERNAME+'/'+n)}" target="_blank" rel="noopener">${esc(n)}</a>`).join(', ');
    }
    return `<div class="month-line">
      <span class="month-label">${esc(monthLabel)}</span>
      <div class="month-content">
        <div class="activity-row">
          <svg class="oct" style="width:16px;height:16px;fill:#8b949e;flex:none"><use href="#i-commit"/></svg>
          <span class="activity-text">${esc(t('createdCommits',g.commits,repoNames.length||1))}</span>
        </div>
        ${repoLine?`<div class="repo-tag">${repoLine}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

function renderOverview(c,repos){
  const box=document.getElementById('contrib-repos');
  const names=(repos||[]).slice(0,5).map(r=>r.name);
  box.innerHTML=names.length
    ? names.map(n=>`<a href="${esc('https://github.com/'+USERNAME+'/'+n)}" target="_blank" rel="noopener">${esc(n)}</a>`).join('<br>')
    : `<span class="skeleton">${esc(t('noActivity'))}</span>`;
  const pct=100, cx=150, cy=80, arm=105;
  const lab=I18N[LANG].quadLabels;
  const svg=`<svg class="quad-svg" viewBox="0 0 300 170" width="300" role="img" aria-label="${esc(t('quadAria',pct))}">
    <line class="axis" x1="${cx-arm}" y1="${cy}" x2="${cx+arm}" y2="${cy}"/>
    <line class="axis" x1="${cx}" y1="${cy-arm+15}" x2="${cx}" y2="${cy+arm-15}"/>
    <circle class="dot" cx="${cx-arm}" cy="${cy}" r="4"/>
    <circle class="dot" cx="${cx+arm}" cy="${cy}" r="4"/>
    <circle class="dot" cx="${cx}" cy="${cy-arm+15}" r="4"/>
    <circle class="dot" cx="${cx}" cy="${cy+arm-15}" r="4"/>
    <text class="quad-label" x="${cx-arm+8}" y="${cy-10}" text-anchor="start">${pct}%</text>
    <text class="quad-label" x="${cx-arm+8}" y="${cy+18}" text-anchor="start">${esc(lab.left)}</text>
    <text class="quad-label" x="${cx}" y="${cy-arm+2}" text-anchor="middle">${esc(lab.top)}</text>
    <text class="quad-label" x="${cx+arm-4}" y="${cy-10}" text-anchor="end">${esc(lab.right)}</text>
    <text class="quad-label" x="${cx}" y="${cy+arm-2}" text-anchor="middle">${esc(lab.bottom)}</text>
  </svg>`;
  document.getElementById('quad-wrap').innerHTML=svg;
}

function renderYears(c){
  const nav=document.getElementById('year-nav');
  const days=c.days||[];
  const years=[...new Set(days.filter(d=>d.count>0).map(d=>d.date.slice(0,4)))].sort().reverse();
  const list=years.length?years:[String(new Date().getUTCFullYear())];
  nav.innerHTML=list.map((y,i)=>`<a class="${i===0?'active':''}" href="${esc('https://github.com/'+USERNAME+'?year='+y)}" target="_blank" rel="noopener">${y}</a>`).join('');
}

function updateNote(){
  const note=document.getElementById('src-note');
  const {liveCount,fallbackCount}=STATE;
  if(fallbackCount===0)note.innerHTML=`<span class="live">${esc(t('noteLiveTag'))}</span> · ${esc(t('noteLive'))}`;
  else if(liveCount===0)note.innerHTML=`<span class="err">${esc(t('noteOfflineTag'))}</span> · ${esc(t('noteOffline'))}`;
  else note.innerHTML=`<span class="live">${esc(t('notePartialTag'))}</span> · ${esc(t('notePartial'))}`;
}

function applyLang(){
  document.documentElement.lang=LANG==='zh'?'zh-CN':'en';
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll('.lang-switch button').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
  if(STATE.contrib){renderHeatmap(STATE.contrib);renderActivity(STATE.contrib,STATE.repos);renderOverview(STATE.contrib,STATE.repos);renderYears(STATE.contrib);}
  updateNote();
  if(STATE.user)document.title=STATE.user.login+' · GitHub';
}
document.querySelectorAll('.lang-switch button').forEach(b=>b.addEventListener('click',()=>{LANG=b.dataset.lang;localStorage.setItem('gh_profile_lang',LANG);applyLang();}));

const FALLBACK={login:'KaomianbaoQQ',name:'KaomianbaoQQ',avatar_url:'https://avatars.githubusercontent.com/u/275017180?v=4'};
const FALLBACK_CONTRIB={total:36,notable:[{date:'2026-04-10',count:1},{date:'2026-10-22',count:1},{date:'2026-10-24',count:1},{date:'2026-11-11',count:13},{date:'2026-11-12',count:6},{date:'2026-11-18',count:13},{date:'2026-11-19',count:1}]};
function expandCalendar(c){
  const map={};c.notable.forEach(d=>map[d.date]={...d,level:d.count>=10?4:d.count>=5?3:d.count>=2?2:1});
  const start=new Date('2025-11-16T00:00:00Z'),days=[];
  for(let i=0;i<369;i++){const k=new Date(start.getTime()+i*86400000).toISOString().slice(0,10);days.push(map[k]||{date:k,count:0,level:0});}
  return {total:c.total,days};
}

async function main(){
  let live=0,fb=0;
  let user=FALLBACK;
  try{user=await getJSON(API_USER);live++;}catch(e){fb++;}
  let repos=[];
  try{const raw=await getJSON(API_REPOS);repos=(Array.isArray(raw)?raw:[]).filter(r=>!r.fork&&r.description&&r.description.trim()).slice(0,6).map(r=>({name:r.name,url:r.html_url}));if(repos.length)live++;else fb++;}catch(e){fb++;}
  let contrib=expandCalendar(FALLBACK_CONTRIB);
  try{const c=await getJSON(API_CONTRIB);const days=(c.contributions||[]).map(x=>({date:x.date,count:x.count,level:x.level}));if(days.length){contrib={total:(c.total&&c.total.lastYear)||0,days};live++;}else fb++;}catch(e){fb++;}

  STATE.user=user;STATE.repos=repos;STATE.contrib=contrib;STATE.liveCount=live;STATE.fallbackCount=fb;
  renderProfile(user);
  applyLang();
}
applyLang();
main();
</script>
</body>
</html>
